name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run software tests without model downloads
        run: python -m unittest discover -s tests -v
